<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminExpress | Sign In</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main class="login">
        <section class="brand" aria-label="AdminExpress">
            <h1>AdminExpress</h1>
        </section>

        <section class="login-panel" aria-labelledby="login-title">
            <div class="login-content">
                <h2 id="login-title">Let's <strong>Sign In</strong> <span aria-hidden="true">👇</span></h2>
                <p class="introduction">Hey, Enter your details to get sign in<br>to your account.</p>

                <form action="#" method="get">
                    <div class="field">
                        <label for="email">Email</label>
                        <div class="input-wrapper">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></svg>
                            <input id="email" name="email" type="email" placeholder="Enter Email" autocomplete="username" required>
                        </div>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/><path d="M12 14v3"/></svg>
                            <input id="password" type="password" placeholder="Enter Password" autocomplete="current-password" required>
                            <svg class="password-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                        </div>
                    </div>

                    <div class="forgot-password"><a href="#">Forgot password?</a></div>
                    <button type="submit">Sign In</button>
                </form>

                <p class="signup">Don't have an account? <a href="#">Sign Up</a></p>
            </div>
        </section>
    </main>
</body>
</html>
